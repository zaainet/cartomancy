<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintage Cartomancy Reading (ဂမ္ဘီရဖဲချပ်ဟောကိန်း)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0b0b;
            --accent-gold: #c5a059;
            --accent-red: #8b0000;
            --border-vintage: #3d312a;
            --text-light: #e6ded3;
            --card-w: 105px;
            --card-h: 160px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% 30%, #1e1715 0%, var(--bg-color) 100%);
            color: var(--text-light);
            font-family: 'Padauk', 'Cinzel', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Header */
        header {
            width: 100%;
            padding: 16px 12px;
            text-align: center;
            background: rgba(10, 8, 8, 0.85);
            border-bottom: 2px solid var(--accent-gold);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        header h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header p {
            margin: 4px 0 0 0;
            font-size: 0.9rem;
            color: #b5a999;
            letter-spacing: 0.5px;
        }

        /* Card Spread Area */
        #table-area {
            flex-grow: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1200px;
            overflow: hidden;
            padding-bottom: 60px;
        }

        #deck-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: var(--card-w);
            height: var(--card-h);
            position: absolute;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            transform-origin: 50% 120%;
        }

        .card:hover {
            z-index: 100 !important;
            transform: translateY(-35px) scale(1.12) !important;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
        }

        .card.picked .card-inner {
            transform: rotateY(180deg) scale(1.15);
            z-index: 120;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 1px solid var(--border-vintage);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
        }

        /* Card Back Design */
        .back {
            background-color: #1a1210;
            background-image: 
                radial-gradient(var(--accent-gold) 15%, transparent 16%),
                linear-gradient(45deg, rgba(0,0,0,0.4) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.4) 75%),
                linear-gradient(45deg, rgba(0,0,0,0.4) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.4) 75%);
            background-size: 16px 16px, 12px 12px, 12px 12px;
            background-position: 0 0, 0 0, 6px 6px;
            border: 2px solid var(--accent-gold);
            outline: 2px solid #111;
            outline-offset: -5px;
        }

        /* Procedural Card Front Styling */
        .front {
            transform: rotateY(180deg);
            background: #faf4e8;
            color: #1a1a1a;
            box-shadow: inset 0 0 15px rgba(139, 115, 85, 0.3);
            border: 1px solid #c0b298;
        }
        .front.red { color: #9c1111; }
        .front.black { color: #1c1c1c; }

        .card-corner {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 18px;
        }
        .card-corner.bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }
        .card-center-suit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4rem;
            opacity: 0.9;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .btn {
            background: rgba(20, 15, 14, 0.85);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Padauk', serif;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .btn:hover {
            background: var(--accent-gold);
            color: #120d0b;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.5);
        }

        /* Reading Modal */
        #reading-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 15px;
        }
        #reading-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #171311;
            border: 1px solid var(--accent-gold);
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(197, 160, 89, 0.2);
            overflow-y: auto;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.35s ease;
        }
        #reading-modal.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: transparent;
            border: 1px solid #66554b;
            color: #bbb;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }

        .modal-title {
            color: var(--accent-gold);
            text-align: center;
            margin: 0 0 4px 0;
            font-size: 1.45rem;
            font-weight: bold;
        }
        .modal-subtitle {
            text-align: center;
            color: #8f8174;
            font-size: 0.85rem;
            font-family: 'Cinzel', serif;
            margin-bottom: 12px;
        }
        .modal-essence {
            font-style: italic;
            text-align: center;
            color: #f1dfc5;
            background: rgba(197, 160, 89, 0.08);
            border-left: 3px solid var(--accent-gold);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .reading-section {
            margin-bottom: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #ded6cc;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .reading-section strong {
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vintage Cartomancy</h1>
        <p>ကံကြမ္မာအဟောလမ်းညွှန်အတွက် ဖဲချပ်တစ်ခုကို နှိုက်ယူပါ</p>
    </header>

    <div id="table-area">
        <div id="deck-container"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="shuffleAndSpread()">ဖဲချပ်မွှေမည် (Shuffle)</button>
    </div>

    <!-- Reading Modal -->
    <div id="reading-modal" onclick="onModalBackdropClick(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 class="modal-title" id="m-title">Card Name</h2>
            <div class="modal-subtitle" id="m-subtitle">SUIT & RANK</div>
            <div class="modal-essence" id="m-essence">Essence</div>
            <div id="m-details"></div>
        </div>
    </div>

    <script>
        // အစုံ (Suits) နှင့် နံပါတ်စဉ် (Ranks) များဆိုင်ရာ အခြေခံ အဓိပ္ပာယ်သဘောတရားများ
        const SUITS = {
            hearts: { name: 'Hearts', symbol: '♥', color: 'red', mm: 'အသည်း (မေတ္တာ၊ ခံစားချက်၊ မိသားစု)', elem: 'ရေဓာတ်' },
            diamonds: { name: 'Diamonds', symbol: '♦', color: 'red', mm: 'ဒေါင့် (စီးပွားရေး၊ ငွေကြေး၊ အောင်မြင်မှု)', elem: 'မြေဓာတ်' },
            clubs: { name: 'Clubs', symbol: '♣', color: 'black', mm: 'ပွင့် (ကြိုးစားအားထုတ်မှု၊ စိတ်ကူးသစ်၊ အခွင့်အလမ်း)', elem: 'မီးဓာတ်' },
            spades: { name: 'Spades', symbol: '♠', color: 'black', mm: 'စပိတ် (အတားအဆီး၊ ဆုံးဖြတ်ချက်၊ စိန်ခေါ်မှု)', elem: 'လေဓာတ်' }
        };

        const RANKS = [
            { key: 'A', label: 'Ace', num: 1 },
            { key: '2', label: '2', num: 2 },
            { key: '3', label: '3', num: 3 },
            { key: '4', label: '4', num: 4 },
            { key: '5', label: '5', num: 5 },
            { key: '6', label: '6', num: 6 },
            { key: '7', label: '7', num: 7 },
            { key: '8', label: '8', num: 8 },
            { key: '9', label: '9', num: 9 },
            { key: '10', label: '10', num: 10 },
            { key: 'J', label: 'Jack', num: 11 },
            { key: 'Q', label: 'Queen', num: 12 },
            { key: 'K', label: 'King', num: 13 }
        ];

        // ၅၂ ချပ်စလုံးအတွက် အဓိပ္ပာယ် သဘောတရားများကို တွက်ချက်ဖန်တီးပေးသည့် စနစ်
        function generateFullDeck() {
            const deck = [];
            for (const [suitKey, suit] of Object.entries(SUITS)) {
                for (const rank of RANKS) {
                    deck.push({
                        id: `${suitKey}_${rank.key}`,
                        suitKey: suitKey,
                        suit: suit,
                        rank: rank,
                        name: `${rank.label} of ${suit.name}`,
                        nameMm: `${suit.name} ${rank.key}`,
                        essence: getEssence(suitKey, rank.key),
                        career: getDomainReading(suitKey, rank.key, 'career'),
                        finance: getDomainReading(suitKey, rank.key, 'finance'),
                        love: getDomainReading(suitKey, rank.key, 'love'),
                        health: getDomainReading(suitKey, rank.key, 'health')
                    });
                }
            }
            return deck;
        }

        // ဖဲချပ်တစ်ခုချင်းစီ၏ မူလအနှစ်သာရ
        function getEssence(s, r) {
            const map = {
                'hearts_A': 'မေတ္တာရေးနှင့် စိတ်နှလုံးချမ်းမြေ့ဖွယ် အစပျိုးခြင်းအသစ်။',
                'diamonds_10': 'ငွေကြေးဥစ္စာ ကြီးမားစွာပြည့်စုံခြင်းနှင့် အကျိုးခံစားခွင့်များ ရရှိခြင်း။',
                'spades_K': 'ဩဇာအာဏာ၊ တိကျပြတ်သားသော ဆုံးဖြတ်ချက်နှင့် ဉာဏ်ပညာဖြင့် ဦးဆောင်ရမည့်ကာလ။',
                'clubs_5': 'ပြိုင်ဆိုင်မှု၊ အားထုတ်ရုန်းကန်ရမှုနှင့် တက်ကြွလှုပ်ရှားရမည့် အခြေအနေ။'
            };
            if (map[`${s}_${r}`]) return map[`${s}_${r}`];
            return `${SUITS[s].mm}နယ်ပယ်တွင် အဆင့် (${r}) အရ ပြောင်းလဲမှုနှင့် သက်ရောက်မှုများ ပေါ်ပေါက်လာမည်။`;
        }

        function getDomainReading(s, r, domain) {
            const suit = SUITS[s];
            if (domain === 'career') {
                if (s === 'clubs') return 'လုပ်ငန်းခွင်တွင် အားသွန်ခွန်စိုက် ကြိုးပမ်းရမည်ဖြစ်ပြီး ရလဒ်ကောင်းများ ထွက်ပေါ်လာမည်။';
                if (s === 'diamonds') return 'စီးပွားရေးဆိုင်ရာ စာချုပ်သစ်များ၊ ရာထူးတိုးခြင်းနှင့် အခွင့်အလမ်းကောင်းများ ကြုံရမည်။';
                if (s === 'spades') return 'လုပ်ငန်းခွင် အပြောင်းအလဲ သို့မဟုတ် ဉာဏ်ပညာသုံး၍ ဖြေရှင်းရမည့် ပြဿနာငယ်များ ကြုံနိုင်သည်။';
                return 'လုပ်ဖော်ကိုင်ဖက်များနှင့် ဆက်ဆံရေးပြေပြစ်ပြီး အကူအညီကောင်းများ ရရှိမည်။';
            }
            if (domain === 'finance') {
                if (s === 'diamonds') return 'ငွေကြေးကံ အထူးကောင်းမွန်နေပြီး ဝင်ငွေစီးဆင်းမှု တည်ငြိမ်တိုးတက်မည်။';
                if (s === 'spades') return 'မလိုလားအပ်သော အသုံးစရိတ်များကို ထိန်းချုပ်ပြီး စာချုပ်စာတမ်းများ သတိထားသင့်သည်။';
                return 'မျှတသော ငွေကြေးအခြေအနေတွင် ရှိနေပြီး မမျှော်လင့်ဘဲ အထောက်အပံ့ရနိုင်သည်။';
            }
            if (domain === 'love') {
                if (s === 'hearts') return 'အချစ်ရေးနှင့် အိမ်ထောင်ရေးတွင် နားလည်မှု ပိုမိုခိုင်မာလာပြီး ကြည်နူးရမည်။';
                if (s === 'spades') return 'အထင်အမြင်လွဲမှားမှုများ မဖြစ်စေရန် စိတ်ရှည်သည်းခံ၍ ရှင်းလင်းပြောဆိုပါ။';
                return 'အပြန်အလှန် လေးစားမှုဖြင့် တည်ငြိမ်စွာ ရှေ့ဆက်နိုင်သော ဆက်ဆံရေးဖြစ်ပါသည်။';
            }
            if (domain === 'health') {
                if (s === 'spades') return 'စိတ်ဖိစီးမှုနှင့် အိပ်ရေးပျက်ခြင်းကို သတိပြုပြီး အနားယူချိန် ပိုပေးပါ။';
                return 'ကျန်းမာရေး ပုံမှန်ကောင်းမွန်နေပြီး ခန္ဓာကိုယ်နှင့် စိတ်ဓာတ် တက်ကြွနေပါမည်။';
            }
            return '';
        }

        const fullDeck = generateFullDeck();
        const deckContainer = document.getElementById('deck-container');
        const modal = document.getElementById('reading-modal');

        // ဖဲချပ်များကို ယပ်တောင်ပုံသဏ္ဌာန် လှပစွာ ဖြန့်ခင်းပေးခြင်း
        function spreadDeck() {
            deckContainer.innerHTML = '';
            // မျက်နှာပြင်ပေါ်တွင် ဖဲချပ် ၂၁ ချပ်ကို ယပ်တောင်ပုံစံ ဖြန့်ခင်းပြသမည်
            const cardsCount = 21;
            const shuffled = [...fullDeck].sort(() => Math.random() - 0.5);
            const activeCards = shuffled.slice(0, cardsCount);

            activeCards.forEach((cardData, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // ယပ်တောင်ပုံ ကွေးညွတ်စေရန် ထောင့်ချိုးနှင့် အကွာအဝေး တွက်ချက်ခြင်း
                const mid = (cardsCount - 1) / 2;
                const offset = i - mid;
                const rot = offset * 3.2; // တစ်ချပ်ချင်းစီ၏ လှည့်ထောင့်
                const transX = offset * 24; // ဘေးဘက်သို့ ခွာထုတ်မှု
                const transY = Math.abs(offset) * 3; // အလယ်ကုန်းပြီး ဘေးနိမ့်သည့် အကွေး

                card.style.transform = `translateX(${transX}px) translateY(${transY}px) rotate(${rot}deg)`;
                card.style.zIndex = i;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="face back"></div>
                        <div class="face front ${cardData.suit.color}">
                            <div class="card-corner top">
                                <span>${cardData.rank.key}</span>
                                <span style="font-size:0.85rem;">${cardData.suit.symbol}</span>
                            </div>
                            <div class="card-center-suit">${cardData.suit.symbol}</div>
                            <div class="card-corner bottom">
                                <span>${cardData.rank.key}</span>
                                <span style="font-size:0.85rem;">${cardData.suit.symbol}</span>
                            </div>
                        </div>
                    </div>
                `;

                card.onclick = () => drawCard(card, cardData);
                deckContainer.appendChild(card);
            });
        }

        function shuffleAndSpread() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.classList.remove('picked');
                card.style.transform = `translateX(0) translateY(0) rotate(0deg)`;
            });

            setTimeout(() => {
                spreadDeck();
            }, 350);
        }

        function drawCard(cardElement, cardData) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('picked'));
            cardElement.classList.add('picked');
            
            setTimeout(() => {
                showReading(cardData);
            }, 550);
        }

        function showReading(data) {
            document.getElementById('m-title').innerText = `${data.rank.label} of ${data.suit.name}`;
            document.getElementById('m-subtitle').innerText = `[ ${data.suit.mm} - ${data.suit.elem} ]`;
            document.getElementById('m-essence').innerText = `"${data.essence}"`;
            
            let detailsHTML = '';
            if (data.career) detailsHTML += `<div class="reading-section"><strong>💼 လုပ်ငန်းခွင်နှင့် ရာထူး</strong> ${data.career}</div>`;
            if (data.finance) detailsHTML += `<div class="reading-section"><strong>💰 စီးပွားရေးနှင့် ဓနဥစ္စာ</strong> ${data.finance}</div>`;
            if (data.love) detailsHTML += `<div class="reading-section"><strong>❤️ အချစ်ရေးနှင့် သံယောဇဉ်</strong> ${data.love}</div>`;
            if (data.health) detailsHTML += `<div class="reading-section"><strong>🌿 ကျန်းမာရေးနှင့် စွမ်းအင်</strong> ${data.health}</div>`;
            
            document.getElementById('m-details').innerHTML = detailsHTML;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function onModalBackdropClick(e) {
            if (e.target === modal) closeModal();
        }

        window.onload = spreadDeck;
    </script>
</body>
</html>
